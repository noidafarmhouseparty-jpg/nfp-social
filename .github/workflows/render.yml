name: render-creatives
on:
  workflow_dispatch:
    inputs:
      redo_all:
        description: 'Delete and re-render every video (slow, ~90 min). Off = only missing files.'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pip install -q pillow numpy
      - name: render
        run: |
          python tools/plan.py
          [ -f tools/audio/a0.wav ] || python tools/audio.py
          if [ "${{ inputs.redo_all }}" = "true" ]; then rm -f media/video/*.mp4; fi
          python tools/render_img.py
          python tools/slot_b.py --render
          python tools/extra.py
          python tools/render_vid.py
      - name: commit
        run: |
          git config user.name "nfp-bot"; git config user.email "nfp-bot@users.noreply.github.com"
          git add -A media creatives content
          git diff --cached --quiet || { git commit -q -m "render: creatives $(date +%F)"; git push -q; }
